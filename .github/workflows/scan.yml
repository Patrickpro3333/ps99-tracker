name: Scan PS99 leaderboards

# Started every 15 minutes by Cloudflare (cloudflare/worker.js), because GitHub's scheduler
# skipped its runs. Three steps: "plan" reads the clan war and both top lists and works out which teams
# changed; "fetch" reads those teams' pages on several machines at once (BIG Games agreed to this for
# PS99 Tracker), together at TOTAL_RATE requests a minute; "merge" builds the files and saves them.
# Teams whose points didn't change are reused, so a scan takes about 3 minutes. If any machine fails,
# nothing is saved and the last good scan stays. GitHub's schedule stays as a backup that only scans when
# the last scan finished over 50 minutes ago; a Cloudflare run only skips when a scan finished in the last
# 2 minutes (it waited behind that scan). When starting it by hand, tick "force" to scan anyway.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Scan even if the last scan just finished
        type: boolean
        default: false

permissions:
  contents: write

env:
  SHARDS: 17        # how many machines share the fetch step (GitHub runs about 20 jobs at once on a free public repo)
  TOTAL_RATE: 1530  # requests a minute for all of them together; each gets an equal share (90 a minute with 17,
                    # under the API's 100 a minute per machine)

concurrency:
  group: ps99-scan
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.fresh.outputs.run }}
    steps:
      - name: Check when the last scan finished
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          when=$(gh api "repos/${GITHUB_REPOSITORY}/commits/data-ranks" --jq '.commit.committer.date' 2>/dev/null || true)
          age=$(( $(date +%s) - $(date -d "${when:-1970-01-01T00:00:00Z}" +%s) ))
          echo "The last scan finished $age seconds ago."
          limit=120; if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then limit=3000; fi
          if [ "$age" -gt "$limit" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  plan:
    needs: check
    if: needs.check.outputs.run == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the previous scan
        run: |
          repo="https://github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$repo" data-ranks > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then git clone -q --depth 1 --branch data-ranks "$repo" prev
          elif [ "$rc" -eq 2 ]; then mkdir -p prev  # first run: the branch doesn't exist yet
          else exit 1; fi                           # never start over just because GitHub didn't answer
      - name: Read the clan war and both top lists, and list the teams that changed
        run: python scan.py plan --leagues 2000 --clans 2000 --rate 90 --prev prev --plan plan.json
      - name: List the fetch machines
        id: shards
        run: echo "list=$(python -c "import os,json;print(json.dumps(list(range(int(os.environ['SHARDS'])))))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 1

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Read this machine's share of the changed teams
        run: python scan.py fetch --plan plan.json --shard ${{ matrix.shard }} --of "$SHARDS" --total-rate "$TOTAL_RATE" --part part-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.shard }}
          path: part-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the previous scan
        run: |
          repo="https://github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$repo" data-ranks > /dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then git clone -q --depth 1 --branch data-ranks "$repo" prev
          elif [ "$rc" -eq 2 ]; then mkdir -p prev  # first run: the branch doesn't exist yet
          else exit 1; fi                           # never start over just because GitHub didn't answer
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Build ranks.json, the player index and the team cache
        run: python scan.py merge --plan plan.json --parts parts --of "$SHARDS" --prev prev --out ranks.json --players players --teams teams
      - name: Save ranks.json and the player index to the data-ranks branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Kept off main on purpose: every commit to main is a site deploy.
          # One commit with no parents, force-pushed, so the branch never piles up old copies.
          mkdir out && mv ranks.json players teams out/ && cd out
          git init -q && git checkout -q --orphan data-ranks && git add -A
          git -c user.name="ps99-scan-bot" -c user.email="ps99-scan-bot@users.noreply.github.com" commit -qm "Update ranks.json"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data-ranks
