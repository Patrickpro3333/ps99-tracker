name: Logo lookup test (temporary)

# Runs names.py on one of GitHub's machines against the last scan and saves nothing. Removed before merging.
on:
  push:
    branches: [claude/project-thread-fbu9u8]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Load the previous scan
        run: git clone -q --depth 1 --branch data-ranks "https://github.com/${GITHUB_REPOSITORY}.git" prev
      - name: Run the names job as the scan would
        run: |
          time python names.py --prev prev --out names
          ls -la names/logo
          python -c "import json;[print(k,len(json.load(open('names/logo/'+k+'.json')))) for k in ('league','clan')]"
          python -c "import json;print('teams with their logo in the names file:',sum('logo' in t for k in ('league','clan') for i in range(512) for t in json.load(open(f'names/team/{k}/{i}.json')).values()))"
