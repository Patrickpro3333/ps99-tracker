name: Test Roblox limits from a GitHub machine
# Temporary: measures how fast Roblox lets a GitHub machine ask for names and pictures. Removed before merging.
on:
  push:
    branches: [claude/project-thread-fbu9u8]
    paths: [.github/workflows/roblox-test.yml]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          curl -sS -o clan.json "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data-ranks/teams/clan.json"
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          ids = []
          for c in list(json.load(open("clan.json"))["teams"].values())[400:]:
              ids += [int(u) for u in c["mem"] if u]
          pos = 0
          def call(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers={"Content-Type": "application/json"})
              t = time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      h, code, n = r.headers, r.status, len(json.load(r).get("data") or [])
              except urllib.error.HTTPError as e:
                  h, code, n = e.headers, e.code, e.read()[:60]
              return f"{code} n={n} {time.monotonic()-t:.2f}s limit={h.get('x-ratelimit-limit')} left={h.get('x-ratelimit-remaining')} reset={h.get('x-ratelimit-reset')} retry={h.get('retry-after')}"
          def take(n):
              global pos
              pos += n
              return ids[pos - n:pos]
          for size, gap, times in ((200, 2.4, 8), (100, 2.4, 10), (50, 1.2, 12), (100, 6, 6)):
              print(f"--- names: {size} players every {gap}s", flush=True)
              for _ in range(times):
                  print(call("https://users.roblox.com/v1/users", {"userIds": take(size), "excludeBannedUsers": False}), flush=True)
                  time.sleep(gap)
              time.sleep(20)
          for size, gap, times in ((100, 0.6, 15), (100, 2, 8), (50, 1, 10)):
              print(f"--- pictures: {size} players every {gap}s", flush=True)
              for _ in range(times):
                  print(call("https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=" + ",".join(map(str, take(size))) + "&size=150x150&format=Png&isCircular=false"), flush=True)
                  time.sleep(gap)
              time.sleep(20)
          PY
