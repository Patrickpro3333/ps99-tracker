# The site itself has no build step. This file only sets up the functions in netlify/functions:
# a scheduled snapshot every 15 minutes and /api/history, both using Netlify Blobs.
[build]
  functions = "netlify/functions"

[build.environment]
  # @netlify/blobs needs Node 22.12+, and functions run on the build's Node version.
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
